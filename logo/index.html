<!doctype html>
<html><head><meta charset="utf-8"><title>runku — logo</title>
<style>
body{background:#0c0e13;color:#eef1f6;font-family:system-ui,sans-serif;padding:40px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.c{background:#15181e;border:1px solid #262b33;border-radius:20px;padding:24px;text-align:center}
.c.light{background:#f7f9fc;color:#12151b}
.c.mono{background:#f7f9fc;color:#12151b}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin:0 0 16px}
p{margin:12px 0 0;font-size:12px;opacity:.6}
img{display:block}
.lockup{display:flex;align-items:center;gap:14px;justify-content:center}
.wm{font-weight:800;font-size:30px;letter-spacing:-.02em}
.wm span{background:linear-gradient(135deg,#3B6EF6,#7D5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
  <div class="c"><h3>Icon · dark</h3>
    <img src="runku-logo.svg" width="96"><p>96 px</p></div>

  <div class="c light"><h3>Icon · light</h3>
    <img src="runku-logo.svg" width="96"><p>96 px</p></div>

  <div class="c"><h3>Lockup (icon + wordmark)</h3>
    <div class="lockup">
      <img src="runku-logo.svg" width="52">
      <div class="wm">run<span>ku</span></div>
    </div>
    <p>horizontal</p></div>

  <div class="c"><h3>App icon (Adaptive)</h3>
    <div style="width:160px;height:160px;border-radius:40px;overflow:hidden;margin:0 auto">
      <img src="runku-logo.svg" width="160" style="margin:-14px 0 0 -14px">
    </div>
    <p>160 px · rounded</p></div>

  <div class="c"><h3>Sizes</h3>
    <div style="display:flex;gap:18px;align-items:flex-end;justify-content:center">
      <img src="runku-logo.svg" width="64">
      <img src="runku-logo.svg" width="40">
      <img src="runku-logo.svg" width="28">
      <img src="runku-logo.svg" width="18">
    </div>
    <p>64 · 40 · 28 · 18</p></div>
</body></html>
