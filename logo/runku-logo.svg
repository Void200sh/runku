<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- runku logo: R monogram + running route -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6EF6"/>
      <stop offset="1" stop-color="#7D5CFF"/>
    </linearGradient>
  </defs>

  <!-- rounded square tile -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#g)"/>

  <!-- R monogram (white) -->
  <path d="M36 84 V36 h20 a15 15 0 0 1 0 30 h-11"
        fill="none" stroke="#FFFFFF" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 66 L72 84"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- running route line (accent) -->
  <path d="M30 96 C46 96 52 88 60 84 C68 80 74 72 88 70"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"
        stroke-dasharray="0.1 9" opacity="0.9"/>
  <circle cx="88" cy="70" r="4.5" fill="#FFFFFF"/>
</svg>
